<!doctype html><meta charset="utf-8"><title>SPA mutation proof</title>
<style>
body{margin:0}#article{width:900px}canvas{display:block}.ui{height:100px;position:relative;background:#448844}
img{display:block;width:900px;height:20px}span{display:block;height:20px;color:transparent;background:#448844;width:900px;overflow:hidden}
.carousel{position:relative;height:40px;overflow:hidden}.item{position:absolute;width:300px;height:40px;background:#448844}
aside{position:sticky;top:0;height:20px;width:900px;background:#448844}
</style>
<article id="article"><div class="ui"><img><span>old status</span><div class="carousel"></div><aside></aside></div></article>
<script>
const article=document.querySelector('#article'),ui=document.querySelector('.ui');let sequence=0;
const source='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="20"><path fill="#448844" d="M0 0h900v20H0z"/></svg>');
document.querySelector('img').src=source;
for(const x of [-525,-225,75,375]){const item=document.createElement('div');item.className='item';item.style.left=x+'px';document.querySelector('.carousel').append(item)}
window.addBlock=(height=100)=>{
 const c=document.createElement('canvas');c.width=900;c.height=height;const ctx=c.getContext('2d'),id=sequence++;
 for(let y=0;y<height;y++){ctx.fillStyle=`rgb(${(id*100+y)%251},${Math.floor((id*100+y)/251)},97)`;ctx.fillRect(0,y,900,1)}
 ctx.fillStyle='white';ctx.font='20px monospace';ctx.fillText(id===0?'TOP':id===38?'BOTTOM':`ROW ${id}`,60,60);return c;
};
for(let i=0;i<39;i++)article.append(addBlock());
window.insert=()=>article.insertBefore(addBlock(200),article.children[5]);
window.reference=()=>{
 const c=document.createElement('canvas');c.width=900;c.height=article.offsetHeight;const ctx=c.getContext('2d');ctx.fillStyle='#448844';ctx.fillRect(0,0,900,100);
 let y=100;for(const block of article.querySelectorAll(':scope > canvas')){ctx.drawImage(block,0,y);y+=block.height}return c.toDataURL().split(',')[1];
};
window.mutate=kind=>{
 if(kind==='class')ui.classList.add('github-selected');
 if(kind==='style')ui.style.backgroundColor='#448844';
 if(kind==='src')document.querySelector('img').src=source+'#updated';
 if(kind==='text')document.querySelector('span').firstChild.data='new status with fixed geometry';
 if(kind==='overlay'){for(const position of ['absolute','fixed']){const div=document.createElement('div');div.style.cssText=`position:${position};top:50px;left:30px;width:200px;height:30px;z-index:10;background:red`;document.body.append(div)}}
 if(kind==='carousel')document.querySelectorAll('.item').forEach((item,i)=>{item.classList.add('active');item.style.transform=`translateX(${i*3}px)`});
 if(kind==='sidebar')document.querySelector('aside').style.opacity='0.9';
};
</script>
