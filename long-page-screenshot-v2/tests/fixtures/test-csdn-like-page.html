<!doctype html><meta charset="utf-8"><title>CSDN-like Region reliability fixture</title>
<style>
html{overflow-anchor:none}body{margin:0;background:#e000e0}#dynamic-banner-zone{height:40px;background:#ff0000}
#target-article{margin-left:80px;width:500px}canvas{display:block}#bottom-zone{height:800px;background:#00ffff}
</style>
<div id="dynamic-banner-zone">OUTSIDE BANNER</div><article id="target-article"></article><div id="bottom-zone">OUTSIDE BOTTOM</div>
<script>
const article = document.getElementById('target-article');
const labels = ['TOP_MARKER','CHECKPOINT_1','CHECKPOINT_2','CHECKPOINT_3','BOTTOM_MARKER'];
for(let i=0;i<5;i++) {
 const canvas=document.createElement('canvas');canvas.width=500;canvas.height=480;canvas.id=labels[i];
 const ctx=canvas.getContext('2d');
 for(let y=0;y<480;y++){const row=i*480+y;ctx.fillStyle=`rgb(${row%251},${Math.floor(row/251)},97)`;ctx.fillRect(0,y,500,1)}
 ctx.fillStyle='white';ctx.font='20px monospace';ctx.fillText(labels[i],100,80);article.append(canvas);
}
window.growArticle=()=>{
 const block=document.createElement('div');block.style.height='300px';
 article.insertBefore(block,document.getElementById('BOTTOM_MARKER'));
};
let step=0,timer;
window.changeBanner=()=>{
 const zone=document.getElementById('dynamic-banner-zone');
 zone.replaceChildren();const child=document.createElement('div');child.textContent='OUTSIDE BANNER '+step;zone.append(child);
 zone.style.height=[120,220,40][step++%3]+'px';
};
window.startBanners=()=>{changeBanner();timer=setInterval(changeBanner,600)};
window.stopBanners=()=>clearInterval(timer);
window.growBottom=()=>document.getElementById('bottom-zone').style.height=(800+step++*100)+'px';
</script>

<style>
#site-header{position:fixed;inset:0 0 auto;height:32px;background:#ff0000;z-index:9}
#site-sidebar{position:sticky;top:0;margin-left:700px;width:100px;height:32px;background:#00ffff}
#outside-modules{position:absolute;top:80px;left:700px;width:100px}
</style>
<header id="site-header">OUTSIDE HEADER</header><aside id="site-sidebar">OUTSIDE SIDEBAR</aside>
<div id="outside-modules"><img loading="lazy" width="80" height="80" alt="lazy ad"></div>
<script>
window.mutateOutside=()=>{
 document.documentElement.style.overflowY='scroll';
 document.documentElement.style.scrollbarGutter='stable both-edges';
 const block=document.createElement('div');block.style.height='80px';
 document.getElementById('bottom-zone').append(block);
 document.getElementById('bottom-zone').style.height='1300px';
 document.querySelector('#outside-modules img').src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="red"/></svg>');
 setTimeout(()=>block.remove(),200);
};
</script>
